<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เกี่ยวกับตัวเอง - Daily Fir</title>

</head>
<body>

      <a href="/app/profile.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>เกี่ยวกับตัวเอง</span></a>
    </aside>

    <main class="main" x-data="profilePage()" x-init="init()">
      <div class="topbar">
        <span class="community-pill" data-community-name></span>
        <a href="#" data-logout class="logout-link">ออกจากระบบ</a>
      </div>

      <h2>เกี่ยวกับตัวเอง 👤</h2>
      <p class="text-muted" style="margin-top:-8px;">ข้อมูลการเงินเริ่มต้นของฉัน (ส่วนตัว ไม่แชร์ให้สมาชิกคนอื่นเห็น)</p>

      <div class="card" x-show="loading"><div class="empty-state">กำลังโหลด...</div></div>

      <template x-if="!loading">
        <div>
          <div class="card">
            <div class="form-group">
              <label>ชื่อเล่น / ชื่อที่ใช้ในระบบ</label>
              <input type="text" x-model="form.nickname" placeholder="เช่น เจ้เล็ก" />
            </div>

            <div class="form-group">
              <label>💵 เงินสดปัจจุบัน (บาท) <span class="text-muted" style="font-weight:400;">— เงินสด</span></label>
              <input type="number" step="0.01" min="0" x-model="form.cash_amount" placeholder="0.00" />
            </div>

            <div class="form-group">
              <label>🏦 เงินในบัญชีธนาคาร (บาท) <span class="text-muted" style="font-weight:400;">— เงินโอน</span></label>
              <input type="number" step="0.01" min="0" x-model="form.bank_amount" placeholder="0.00" />
            </div>

            <div class="form-group">
              <label>📱 เงินใน E-Wallet (บาท) <span class="text-muted" style="font-weight:400;">— เงินโอน</span></label>
              <input type="number" step="0.01" min="0" x-model="form.ewallet_amount" placeholder="0.00" />
            </div>

            <div class="form-group">
              <label>อื่น ๆ</label>
              <template x-for="(item, index) in form.other_items" :key="index">
                <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                  <input type="text" x-model="item.label" placeholder="ชื่อรายการ เช่น ทองคำ" style="flex:2; min-width:120px; padding:10px; border:1px solid var(--color-border); border-radius:8px;" />
                  <input type="number" step="0.01" min="0" x-model="item.amount" placeholder="0.00" style="flex:1; min-width:90px; padding:10px; border:1px solid var(--color-border); border-radius:8px;" />
                  <select x-model="item.payment_method" style="flex:1; min-width:100px; padding:10px; border:1px solid var(--color-border); border-radius:8px;">
                    <option value="cash">💵 เงินสด</option>
                    <option value="transfer">🏦 เงินโอน</option>
                  </select>
                  <button class="btn btn-danger" style="padding:0 12px;" @click="removeOtherItem(index)">✕</button>
                </div>
              </template>
              <button class="btn" style="border:1px solid var(--color-border); font-size:0.85rem;" @click="addOtherItem()">+ เพิ่มอื่น ๆ</button>
            </div>
          </div>

          <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:0.9rem; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--color-border);">
              <span class="text-muted">💵 รวมเงินสด</span>
              <span x-text="formatCurrency(totalCash)"></span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.9rem; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--color-border);">
              <span class="text-muted">🏦 รวมเงินโอน</span>
              <span x-text="formatCurrency(totalTransfer)"></span>
            </div>
            <div style="display:flex; justify-content:space-between; font-weight:600;">
              <span>รวมเงินทั้งหมด</span>
              <span x-text="formatCurrency(totalAmount)"></span>
            </div>
          </div>

          <p x-show="errorMsg" x-text="errorMsg" style="color:#c0392b; font-size:0.9rem;"></p>
          <p x-show="savedMsg" x-text="savedMsg" style="color:var(--color-primary-dark); font-size:0.9rem;"></p>

          <button class="btn btn-primary btn-block" :disabled="saving" @click="save()">
            <span x-text="saving ? 'กำลังบันทึก...' : 'บันทึก'"></span>
          </button>
        </div>
      </template>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="/app/dashboard.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>สรุปยอด</span></a>
    <a href="/app/transactions.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg><span>รายการ</span></a>
    <a href="/app/categories.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span>หมวดหมู่</span></a>
    <a href="/app/reports.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span>รายงาน</span></a>
    <a href="/app/members.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>สมาชิก</span></a>
    <a href="/app/profile.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>ตัวเอง</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/community.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/js/pwa.js"></script>
  <script>
    function profilePage() {
      return {
        loading: true,
        saving: false,
        errorMsg: "",
        savedMsg: "",
        form: defaultProfileForm(),

        async init() {
          if (window.CURRENT_COMMUNITY_ID) {
            await this.loadProfile();
          } else {
            document.addEventListener("app:ready", () => this.loadProfile());
          }
        },

        async loadProfile() {
          this.loading = true;
          try {
            const { data, error } = await DB.getMyFinanceProfile();
            if (error) throw error;
            if (data) {
              this.form = {
                nickname: data.nickname || "",
                cash_amount: data.cash_amount,
                bank_amount: data.bank_amount,
                ewallet_amount: data.ewallet_amount,
                other_items: (data.other_items || []).map((i) => ({
                  label: i.label,
                  amount: i.amount,
                  payment_method: i.payment_method || "cash",
                })),
              };
            }
          } catch (e) {
            this.errorMsg = "โหลดข้อมูลไม่สำเร็จ: " + e.message;
          } finally {
            this.loading = false;
          }
        },

        addOtherItem() {
          this.form.other_items.push({ label: "", amount: "", payment_method: "cash" });
        },

        removeOtherItem(index) {
          this.form.other_items.splice(index, 1);
        },

        get totalAmount() {
          const base =
            (parseFloat(this.form.cash_amount) || 0) +
            (parseFloat(this.form.bank_amount) || 0) +
            (parseFloat(this.form.ewallet_amount) || 0);
          const otherTotal = this.form.other_items.reduce(
            (sum, i) => sum + (parseFloat(i.amount) || 0),
            0
          );
          return base + otherTotal;
        },

        get totalCash() {
          const otherCash = this.form.other_items
            .filter((i) => i.payment_method !== "transfer")
            .reduce((sum, i) => sum + (parseFloat(i.amount) || 0), 0);
          return (parseFloat(this.form.cash_amount) || 0) + otherCash;
        },

        get totalTransfer() {
          const otherTransfer = this.form.other_items
            .filter((i) => i.payment_method === "transfer")
            .reduce((sum, i) => sum + (parseFloat(i.amount) || 0), 0);
          return (
            (parseFloat(this.form.bank_amount) || 0) +
            (parseFloat(this.form.ewallet_amount) || 0) +
            otherTransfer
          );
        },

        async save() {
          this.errorMsg = "";
          this.savedMsg = "";
          this.saving = true;

          try {
            const payload = {
              nickname: this.form.nickname.trim() || null,
              cash_amount: parseFloat(this.form.cash_amount) || 0,
              bank_amount: parseFloat(this.form.bank_amount) || 0,
              ewallet_amount: parseFloat(this.form.ewallet_amount) || 0,
              other_items: this.form.other_items
                .filter((i) => i.label.trim() || parseFloat(i.amount) > 0)
                .map((i) => ({
                  label: i.label.trim(),
                  amount: parseFloat(i.amount) || 0,
                  payment_method: i.payment_method || "cash",
                })),
            };

            const { error } = await DB.upsertMyFinanceProfile(payload);
            if (error) throw error;

            this.savedMsg = "บันทึกเรียบร้อย ✓";
            setTimeout(() => (this.savedMsg = ""), 2000);
          } catch (e) {
            this.errorMsg = "บันทึกไม่สำเร็จ: " + e.message;
          } finally {
            this.saving = false;
          }
        },

        formatCurrency(n) {
          return AppUtils.formatCurrency(n);
        },
      };
    }

    function defaultProfileForm() {
      return {
        nickname: "",
        cash_amount: "",
        bank_amount: "",
        ewallet_amount: "",
        other_items: [],
      };
    }
  </script>
</body>
</html>
